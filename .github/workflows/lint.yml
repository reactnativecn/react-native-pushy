name: lint

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# Cancel a currently running workflow from the same PR/branch/tag
# when a new workflow is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install Dependency
        run: bun install --frozen-lockfile

      # `bun lint` ends with check-native-spec-parity.js: every
      # src/NativePushy.ts method must be exported by all four native
      # bindings, with the right sync/async kind on Harmony.
      - name: Run lint
        run: bun lint

      - name: Verify publish file list
        run: node scripts/check-packlist.js
