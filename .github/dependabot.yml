version: 2
updates:
  # Actions are pinned to commit SHAs in the workflows; Dependabot keeps the
  # SHA + version comment pairs current instead of a human copying hashes.
  # The local composite actions pin SHAs too and are not scanned from "/".
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
